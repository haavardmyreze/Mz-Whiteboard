<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f0f0f">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('wb:theme')) || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
  <title>Wipboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="home">
  <header class="home-bar">
    <div class="home-head">
      <a class="brand" href="#/" aria-label="All boards">
        <span class="logomark" data-logo-slot></span>
        <span>Wipboard</span>
      </a>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search boards and folders" autocomplete="off" spellcheck="false" aria-label="Search boards and folders">
        <kbd>/</kbd>
      </label>
      <div class="spacer"></div>
      <span id="themeslot"></span>
      <button id="me" class="chip" title="Change your name"></button>
      <button id="newfolder" class="btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2.5h8a2 2 0 0 1 2 2V17a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M12 11v5M9.5 13.5h5"/></svg>
        New folder
      </button>
      <button id="new" class="btn primary">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
        New board
      </button>
    </div>
  </header>
  <main>
    <nav id="spaces" class="spaces" aria-label="Workspaces" hidden></nav>
    <nav id="crumbs" class="crumbs" aria-label="Folder path"></nav>
    <div id="content"></div>
    <p id="empty" class="home-empty" hidden></p>
  </main>
  <script src="/common.js"></script>
  <script src="/home.js"></script>
</body>
</html>
