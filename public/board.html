<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <script src="/boot.js"></script>
  <title>Boards by Myreze</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rift-demi.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rift-light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="board">
  <div id="viewport">
    <div id="world">
      <div id="frames"></div>
      <div id="items"></div>
      <div id="inks"></div>
    </div>
    <div id="hint" hidden>
      <strong>This board is empty</strong>
      <span class="hint-edit">Drop images or video here, paste from the clipboard, or press <kbd>N</kbd> for a note.</span><span class="hint-guest">Nothing has been put on it yet.</span>
    </div>
    <div id="marquee" hidden></div>
    <div id="selbox" hidden>
      <i class="handle side n" data-h="n"></i><i class="handle side e" data-h="e"></i>
      <i class="handle side s" data-h="s"></i><i class="handle side w" data-h="w"></i>
      <i class="handle nw" data-h="nw"></i><i class="handle ne" data-h="ne"></i>
      <i class="handle sw" data-h="sw"></i><i class="handle se" data-h="se"></i>
    </div>
    <canvas id="laser"></canvas>
    <svg id="guides" aria-hidden="true"><path id="guidepath"/></svg>
    <div id="eraser" hidden></div>
    <div id="cursors"></div>
    <div id="followring" hidden></div>
    <div id="dropzone" hidden><span>Drop to add to the board</span></div>
  </div>
  <!-- One bar, the same on every page: where you are on the left, what you can do there on the right.
       With an image or video open it is the viewer's bar too, so nothing else lies over the piece. -->
  <header id="topbar" class="appbar chrome">
    <a class="brand" href="/" title="Back to the boards" id="back" draggable="false"><span class="logomark" data-logo-slot></span><span class="wordmark">Boards</span></a>
    <span class="bar-slash" aria-hidden="true">/</span>
    <input id="boardname" class="board-only" type="text" maxlength="120" spellcheck="false" aria-label="Board name">
    <span id="conn" hidden>Reconnecting…</span>
    <div class="spacer"></div>
    <!-- How much of the board's video is cached on this computer: a small ring that fills, with a word to say what it counts. -->
    <button id="kept" hidden><svg viewBox="0 0 20 20" aria-hidden="true"><circle class="track" cx="10" cy="10" r="7"/><circle class="arc" cx="10" cy="10" r="7"/><path class="tick" d="M6.6 10.3l2.3 2.3 4.6-5"/></svg><span class="kept-label"></span></button>
    <div id="peers"></div>
    <span class="bar-group board-only">
      <button id="snap" class="iconbtn" title="Smart snapping. Hold Ctrl while dragging to bypass (S)"></button>
      <button id="zoom" class="btn ghost" title="Fit everything (Shift+1)">100%</button>
    </span>
    <span id="themeslot"></span>
    <button id="help" class="iconbtn" title="Keyboard shortcuts (?)">?</button>
    <button id="catalogue" class="iconbtn board-only" title="The project's catalogue: its assets, sets and shots, to put on the board" hidden></button>
    <button id="activity" class="iconbtn board-only" title="Activity: who has opened and changed this board, and earlier versions of it" hidden></button>
    <button id="boardmenu" class="iconbtn board-only" title="Board settings: file names, sharing, files, activity" hidden></button>
    <button id="share" class="btn primary board-only" title="Share with the team, or with a link people outside it can open" hidden>Share</button>
  </header>
  <nav id="toolbar" class="chrome"></nav>
  <div id="tooloptions" class="chrome" hidden></div>
  <div id="seltools" hidden></div>
  <aside id="threadpanel" class="chrome" aria-label="All comments" hidden></aside>
  <div id="followpill" hidden></div>
  <div id="helppanel" hidden></div>
  <div id="actpanel" class="chrome" hidden></div>
  <div id="catpanel" class="chrome" aria-label="Catalogue" hidden></div>
  <div id="setpanel" class="chrome" hidden></div>
  <div id="toasts"></div>
  <input id="filepick" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>
  <script src="/common.js"></script>
  <script src="/icons.js"></script>
  <script src="/media.js"></script>
  <script src="/naming.js"></script>
  <script src="/ingest.js"></script>
  <script src="/filing.js"></script>
  <script src="/ink.js"></script>
  <script src="/cuttrack.js"></script>
  <script src="/viewer.js"></script>
  <script src="/snap.js"></script>
  <script src="/board.js"></script>
</body>
</html>
