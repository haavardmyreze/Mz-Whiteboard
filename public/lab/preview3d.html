<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D preview · lab</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css">
  <link rel="stylesheet" href="/lab/preview3d.css">
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body class="p3">
  <canvas id="stage"></canvas>
  <svg id="ink" class="p3-ink" viewBox="0 0 1 1" preserveAspectRatio="none" hidden></svg>
  <header class="p3-bar">
    <b>3D preview</b><span class="p3-lab">lab</span>
    <label class="btn small">Model (.glb)<input id="pickModel" type="file" accept=".glb,.gltf,model/gltf-binary" hidden></label>
    <button id="pickVersion" class="btn small primary" type="button" aria-expanded="false" title="Show a version filed in a project">Filed version…</button>
    <select id="verView" class="v-pick" aria-label="Which view of the version" hidden></select>
    <label class="btn small ghost" title="Or a video or still from this computer">File…<input id="pickMedia" type="file" accept="video/*,image/*" hidden></label>
    <label class="p3-field">Screen material <input id="screenName" type="text" value="screen" spellcheck="false"></label>
    <button id="mainView" class="btn small" type="button" aria-pressed="false" title="Look through the model's main camera (V)">Main camera</button>
    <button id="pen" class="btn small" type="button" aria-pressed="false" title="Draw, through the main camera (P)">Draw</button>
    <button id="clearInk" class="btn small ghost" type="button" title="Take away what is drawn on this frame">Clear</button>
    <select id="cams" class="v-pick" aria-label="Viewpoint, moving freely"></select>
    <span class="spacer"></span>
    <span id="status" class="p3-status">Drop a .glb and a video anywhere</span>
  </header>
  <aside id="report" class="p3-report" hidden></aside>
  <div id="verPanel" class="p3-panel" hidden>
    <div class="p3-panel-head">
      <select id="verProject" class="v-pick" aria-label="Project"></select>
      <input id="verSearch" type="search" placeholder="Search versions or who filed them" spellcheck="false" autocomplete="off">
    </div>
    <div id="verList" class="p3-vers"></div>
  </div>
  <footer class="p3-foot">
    <button id="play" class="iconbtn" title="Play or pause (Space)" aria-label="Play or pause">▶</button>
    <span id="time" class="p3-time">0:00</span>
    <input id="scrub" type="range" min="0" max="1000" value="0" aria-label="Where in the video">
    <span class="p3-keys">W A S D fly along the view · Q E down / up · drag to look · Shift faster · wheel glides (held button + wheel: speed) · , . a frame · V main camera · P draw</span>
  </footer>
  <script type="module" src="/lab/preview3d.js"></script>
</body>
</html>
