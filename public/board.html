<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <meta name="theme-color" content="#0f0f0f">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('wb:theme')) || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
  <title>Wipboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="board">
  <div id="viewport">
    <div id="world">
      <div id="frames"></div>
      <div id="items"></div>
      <div id="inks"></div>
    </div>
    <div id="hint" hidden>
      <strong>This board is empty</strong>
      <span>Drop images or video here, paste from the clipboard, or press <kbd>N</kbd> for a note.</span>
    </div>
    <div id="marquee" hidden></div>
    <div id="selbox" hidden>
      <i class="handle nw" data-h="nw"></i><i class="handle ne" data-h="ne"></i>
      <i class="handle sw" data-h="sw"></i><i class="handle se" data-h="se"></i>
    </div>
    <canvas id="laser"></canvas>
    <svg id="guides" aria-hidden="true"><path id="guidepath"/></svg>
    <div id="eraser" hidden></div>
    <div id="pins"></div>
    <div id="cursors"></div>
    <div id="followring" hidden></div>
    <div id="dropzone" hidden><span>Drop to add to the board</span></div>
  </div>

  <header id="topbar" class="chrome">
    <a class="iconbtn" href="/" title="All boards" id="back" data-logo-slot></a>
    <input id="boardname" type="text" maxlength="120" spellcheck="false" aria-label="Board name">
    <span id="conn" hidden>Reconnecting…</span>
    <div class="spacer"></div>
    <div id="peers"></div>
    <span class="sep"></span>
    <button id="comments" class="btn ghost" title="All comments (Shift+C)"><span id="commentsicon"></span><span class="lbl">Comments</span><span id="commentcount" class="count" hidden></span></button>
    <button id="snap" class="iconbtn" title="Smart snapping. Hold Ctrl while dragging to bypass (S)"></button>
    <button id="zoom" class="btn ghost" title="Fit everything (Shift+1)">100%</button>
    <span id="themeslot"></span>
    <button id="help" class="iconbtn" title="Keyboard shortcuts (?)">?</button>
    <span class="sep"></span>
    <button id="share" class="btn ghost" title="Make a view-only link anyone can open" hidden>Share</button>
    <button id="present" class="btn brand" title="Present this board to everyone on it">Present</button>
  </header>

  <nav id="toolbar" class="chrome"></nav>
  <div id="tooloptions" class="chrome" hidden></div>
  <div id="seltools" hidden></div>
  <div id="thread" class="chrome" hidden></div>
  <aside id="commentpanel" class="chrome" hidden></aside>

  <div id="followpill" hidden></div>
  <div id="focusbar" hidden>
    <button class="iconbtn" id="focusprev" title="Previous (←)"></button>
    <span id="focuspos"></span>
    <button class="iconbtn" id="focusnext" title="Next (→)"></button>
    <span class="sep"></span>
    <span id="focusname"></span>
    <span class="hint" id="focushint"></span>
    <button class="btn small ghost" id="focusclear" title="Delete everything drawn on this image">Clear drawing</button>
    <button class="btn small primary" id="focusdone" title="Close (Esc)">Done</button>
  </div>
  <div id="presentbar" hidden>
    <button class="iconbtn" id="pprev" title="Previous (←)"></button>
    <div id="pstep"></div>
    <button class="iconbtn" id="pnext" title="Next (→)"></button>
    <span class="sep"></span>
    <button class="btn ghost" id="plaser" title="Laser pointer (L)">Laser</button>
    <button class="btn primary" id="pexit" title="Stop presenting (Esc)">Stop presenting</button>
  </div>

  <div id="helppanel" hidden></div>
  <div id="toasts"></div>
  <input id="filepick" type="file" accept="image/*,video/mp4,video/webm,video/quicktime" multiple hidden>

  <script src="/common.js"></script>
  <script src="/board.js"></script>
</body>
</html>
