<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f0f0f">
  <script>try { document.documentElement.dataset.theme = JSON.parse(localStorage.getItem('wb:theme')) || 'dark'; } catch (e) { document.documentElement.dataset.theme = 'dark'; }</script>
  <title>Admin · Wipboard</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
</head>
<body class="home admin">
  <header class="home-bar">
    <div class="home-head">
      <a class="brand" href="/" aria-label="All boards">
        <span class="logomark" data-logo-slot></span>
        <span>Wipboard</span>
      </a>
      <span class="admin-title">Admin</span>
      <div class="spacer"></div>
      <span id="themeslot"></span>
      <a class="btn" href="/">All boards</a>
    </div>
  </header>
  <main>
    <p class="admin-note">Groups and permissions are kept here but not enforced yet. Who can sign in is still set by the
      sign-in settings, and everyone signed in sees the shared workspace.</p>
    <nav id="tabs" class="spaces" aria-label="Admin sections" hidden></nav>
    <p id="status" class="admin-status" role="status" hidden></p>
    <div id="content"></div>
  </main>
  <script src="/common.js"></script>
  <script src="/admin.js"></script>
</body>
</html>
