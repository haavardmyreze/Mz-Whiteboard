<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090909">
  <script src="/boot.js"></script>
  <title>Boards by Myreze</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rift-demi.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/rift-light.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/style.css">
  <!-- three.js, for a project's 3D view (view3d.js): only fetched when it is asked for. -->
  <script type="importmap">{ "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/addons/" } }</script>
</head>
<body class="home">
  <header class="appbar home-bar">
    <div class="home-head">
      <button id="sidetoggle" class="iconbtn side-toggle" type="button" aria-label="Show the folders" aria-controls="side" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
      <a class="brand" href="#/" aria-label="Home">
        <span class="logomark" data-logo-slot></span>
        <span class="wordmark">Boards<span class="wm-by"> by Myreze</span></span>
      </a>
      <!-- Where you are, in the bar itself, on a page that wants all of the window for its work (an animatic),
           as a board's bar has it. -->
      <nav id="barpath" class="bar-path" aria-label="Where you are" hidden></nav>
      <label class="search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
        <input id="q" type="search" placeholder="Search boards and folders" autocomplete="off" spellcheck="false" aria-label="Search boards and folders">
        <kbd>/</kbd>
      </label>
      <button id="searchtoggle" class="iconbtn search-toggle" type="button" aria-label="Search" aria-controls="q" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4-4"/></svg>
      </button>
      <div class="spacer"></div>
      <div class="bellwrap">
        <button id="bell" class="iconbtn" title="Notifications" aria-label="Notifications" aria-haspopup="dialog" aria-expanded="false">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15z"/><path d="M10 20.5a2.2 2.2 0 0 0 4 0"/></svg>
          <span id="bellcount" class="bell-count" hidden></span>
        </button>
        <section id="notices" class="notices" role="dialog" hidden aria-label="Notifications"></section>
      </div>
      <button id="me" class="chip" title="Change your name"></button>
      <span id="presentslot" hidden></span>
      <!-- What can be made here, in one control: a board, and beside it the rest (a folder). -->
      <span id="newsplit" class="split">
        <button id="new" class="btn primary">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
          <span class="lbl">New board</span>
        </button>
        <button id="newmore" class="btn primary split-more" type="button" aria-haspopup="menu" aria-label="More to make" title="New board or folder">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 10l5 5 5-5"/></svg>
        </button>
      </span>
    </div>
  </header>
  <div class="home-wrap">
    <nav id="side" class="side" aria-label="Workspaces and folders"></nav>
    <div id="sidescrim" class="side-scrim"></div>
    <main>
      <!-- Where you are: the way here as one small line, and the place itself as the page's title, with
           what belongs to it (its pin, its settings) beside it and the way lists are shown at the end.
           A project's home may have its banner over all of it. -->
      <header class="page-head">
        <div id="pagebanner" class="page-banner" hidden></div>
        <nav id="crumbs" class="crumbs" aria-label="Where you are"></nav>
        <div class="page-title-row">
          <h1 id="pagetitle" class="page-title"></h1>
          <span id="pagetools" class="page-tools"></span>
          <span class="spacer"></span>
          <span id="layoutslot"></span>
        </div>
      </header>
      <div id="content"></div>
      <p id="empty" class="home-empty" hidden></p>
    </main>
  </div>
  <div id="catdrop" class="cat-drop" hidden><span>Drop to add to the catalogue</span></div>
  <script src="/common.js"></script>
  <script src="/icons.js"></script>
  <script src="/media.js"></script>
  <script src="/naming.js"></script>
  <script src="/ingest.js"></script>
  <script src="/filing.js"></script>
  <script src="/claude.js"></script>
  <script src="/ink.js"></script>
  <script src="/cuttrack.js"></script>
  <script src="/viewer.js"></script>
  <script src="/cut.js"></script>
  <script src="/animatic.js"></script>
  <script src="/account.js"></script>
  <script src="/notices.js"></script>
  <script src="/present.js"></script>
  <script src="/vocabulary.js"></script>
  <script src="/home.js"></script>
</body>
</html>
